<section class="com-funciona snap-section" id="com-funciona">
  <div class="section-wrap">
    <span class="section-num">03</span>
    <h2 class="section-headline">{{ .heading }}</h2>
    {{ range .steps }}
      <div class="step-line">
        <div class="step-number">{{ .icon }}</div>
        <div>
          <h3>{{ .title }}</h3>
          <p>{{ .text }}</p>
        </div>
      </div>
    {{ end }}
  </div>
</section>
