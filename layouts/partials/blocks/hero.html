<section class="hero snap-section" id="inici">
  <div class="video-bg">
    <video autoplay muted loop playsinline>
      {{ if .video_file }}
        <source src="{{ printf "/video/%s" .video_file }}" type="video/mp4">
      {{ else }}
        <source src="/video/fons.mp4" type="video/mp4">
      {{ end }}
    </video>
  </div>
  <div class="section-wrap hero-content">
    <span class="section-num">01</span>
    <h1 class="section-headline">{{ .heading }}</h1>
    {{ if .subtext }}<p class="section-sub">{{ .subtext }}</p>{{ end }}
    {{ if .cta }}<a href="{{ .cta.url }}" class="btn-primary">{{ .cta.text }}</a>{{ end }}
  </div>
</section>
