<section class="contacte snap-section" id="contacte">
  <div class="container">
    <h2>{{ .heading }}</h2>
    {{ if .subtext }}<p class="subtext">{{ .subtext }}</p>{{ end }}
    <form name="contacte" method="POST" data-netlify="true" class="contact-form">
      <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" name="nom" required>
      </div>
      <div class="form-group">
        <label for="email">Correu electrònic</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="missatge">Missatge</label>
        <textarea id="missatge" name="missatge" rows="4" required></textarea>
      </div>
      <button type="submit" class="btn">Enviar</button>
    </form>
  </div>
</section>
