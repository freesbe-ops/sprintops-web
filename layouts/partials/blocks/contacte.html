<section class="contacte snap-section" id="contacte">
  <div class="section-wrap">
    <span class="section-num">06</span>
    <h2 class="section-headline">{{ .heading }}</h2>
    <a href="https://wa.me/34644318333" class="btn-ghost" target="_blank" rel="noreferrer noopener">644 31 83 33</a>
    {{ if .subtext }}<p class="section-sub">{{ .subtext }}</p>{{ end }}
    <form action="https://script.google.com/macros/s/AKfycbwDgvYhfB-6gHz7FpqsdxwUAV2KollOpWroXCCMQi-YQqCtuAJkhyGm9agINKROHJ5FbA/exec" method="POST" class="contact-form">
      <div class="field">
        <input type="text" id="nom" name="nombre" class="field-input" placeholder="NOM" required>
      </div>
      <div class="field">
        <input type="email" id="email" name="email" class="field-input" placeholder="CORREU ELECTRÒNIC" required>
      </div>
      <div class="field">
        <input type="tel" id="telefon" name="telefono" class="field-input" placeholder="TELÈFON">
      </div>
      <div class="field">
        <textarea id="missatge" name="mensaje" class="field-input" rows="4" placeholder="MISSATGE" required></textarea>
      </div>
      <button type="submit" class="btn-primary">ENVIAR</button>
    </form>
  </div>
</section>
