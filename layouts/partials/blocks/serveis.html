<section class="services snap-section" id="serveis">
  <div class="container">
    <h2>{{ .heading }}</h2>
    <div class="services-grid">
      {{ range .items }}
        <div class="service-item">
          <h3>{{ .title }}</h3>
          <p>{{ .text }}</p>
        </div>
      {{ end }}
    </div>
  </div>
</section>
