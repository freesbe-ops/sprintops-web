<section class="serveis snap-section" id="serveis">
  <div class="carousel-wrapper">
    {{ range .items }}
      <div class="carousel-slide">
        <h2 class="servei-title">{{ .title }}</h2>
        {{ if .subtitle }}<h3 class="servei-subtitle">{{ .subtitle }}</h3>{{ end }}
        <p class="servei-text">{{ .text }}</p>
      </div>
    {{ end }}
  </div>
</section>
