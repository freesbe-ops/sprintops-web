<section class="creixem-junts snap-section" id="creixem-junts">
  <div class="section-wrap">
    <span class="section-num">04</span>
    <h2 class="section-headline">{{ .heading }}</h2>
    {{ if .highlight }}
      <p class="section-sub">{{ .highlight }}</p>
    {{ end }}
    {{ if .body }}
      <div class="section-sub">
        {{ .body | markdownify }}
      </div>
    {{ end }}
    {{ if .cta }}
      <a href="{{ .cta.url }}" class="btn-primary">{{ .cta.text }}</a>
    {{ end }}
  </div>
</section>
